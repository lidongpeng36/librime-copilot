name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt install -y clang-format
      - name: Lint
        run: find src tools -name '*.cc' -o -name '*.h' | xargs clang-format -Werror --dry-run || { echo Please lint your code by '"'"find src tools -name '*.cc' -o -name '*.h' | xargs clang-format -i"'"'.; false; }

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout librime
        uses: actions/checkout@v4
        with:
          repository: rime/librime

      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          path: plugins/copilot

      - name: Install dependency
        run: ./action-install-linux.sh

      - name: Build librime with plugin
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_ASAN=ON
          cmake --build build

      - name: Run plugin unit tests
        # detect_odr_violation=0: llama.cpp's static lib is linked into both
        # librime.so and copilot_test (via the plugin objects), so ASan sees its
        # file-scope `SUPPORTED` global registered twice. This is the known-benign
        # duplicate-in-shared-and-executable case, not a real ODR bug.
        env:
          ASAN_OPTIONS: detect_odr_violation=0
        run: ctest --test-dir build -R copilot_test --output-on-failure
