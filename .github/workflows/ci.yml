name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt install -y clang-format
      - name: Lint
        run: find src tools -name '*.cc' -o -name '*.h' | xargs clang-format -Werror --dry-run || { echo Please lint your code by '"'"find src tools -name '*.cc' -o -name '*.h' | xargs clang-format -i"'"'.; false; }
      # Not the runner's system python: on ubuntu-24.04 that one is
      # externally managed (PEP 668) and refuses a plain `pip install`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The three RUNTIME_REQUIREMENTS from tools/rime_copilot/install.py. They
      # are imported lazily so every module loads without them, but the tests
      # that reach the imports are the ones worth having: speller.syllables is
      # the Han-to-double-pinyin conversion the whole replay harness stands on.
      # Skipping those in CI would leave it uncovered.
      - name: Install Python tool dependencies
        run: python3 -m pip install --quiet pypinyin requests beautifulsoup4
      - name: Python tool tests
        run: python3 -m unittest discover -s tools/test -p '*_test.py' -v


  # There is no build job, deliberately (2026-09-30). It checked out librime
  # unpinned on ubuntu and built the plugin with ASAN, and it went red far more
  # often for reasons that were not this repo's -- upstream moving boost out of
  # apt, a Linux-only include-path difference -- than for a real regression.
  # The plugin only ships on macOS. Build and run copilot_test locally before
  # pushing (CLAUDE.md, "Build & lint"); this workflow gates lint and the
  # Python tool tests only.
